<div style="position:relative;width:100%;height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
<svg width="100%" height="100%" viewBox="0 0 680 420" role="img">
<title>Orbiting particles animation</title>
<desc>Colored particles orbiting a central pulsing core at different speeds and radii.</desc>
<defs>
<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#7F77DD" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
</radialGradient>
</defs>
<circle cx="340" cy="210" r="70" fill="url(#coreGlow)">
<animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="340" cy="210" r="14" fill="#534AB7">
<animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
</circle>

<g>
<circle cx="340" cy="210" r="0" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.5"><animate attributeName="r" values="100" dur="1s"/></circle>
</g>
<circle cx="340" cy="210" r="100" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.4"/>
<circle cx="340" cy="210" r="150" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.4"/>
<circle cx="340" cy="210" r="60" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.4"/>

<g>
<circle r="8" fill="#1D9E75">
<animateMotion dur="4s" repeatCount="indefinite" path="M 440,210 A 100,100 0 1,1 240,210 A 100,100 0 1,1 440,210"/>
</circle>
</g>
<g>
<circle r="6" fill="#D85A30">
<animateMotion dur="6s" repeatCount="indefinite" path="M 490,210 A 150,150 0 1,1 190,210 A 150,150 0 1,1 490,210"/>
</circle>
</g>
<g>
<circle r="5" fill="#D4537E">
<animateMotion dur="2.5s" repeatCount="indefinite" path="M 400,210 A 60,60 0 1,1 280,210 A 60,60 0 1,1 400,210"/>
</circle>
</g>
<g>
<circle r="7" fill="#378ADD">
<animateMotion dur="7s" repeatCount="indefinite" path="M 510,210 A 170,170 0 1,0 170,210 A 170,170 0 1,0 510,210"/>
</circle>
</g>
<g>
<circle r="4" fill="#EF9F27">
<animateMotion dur="3.2s" repeatCount="indefinite" path="M 380,210 A 40,40 0 1,1 300,210 A 40,40 0 1,1 380,210"/>
</circle>
</g>
</svg>
</div>
